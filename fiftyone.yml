name: "@albumentations/albumentationsx"
type: plugin
author: Albumentations Team
version: 0.1.2
url: https://github.com/albumentations-team/voxel51-plugin
license: AGPL-3.0-only
description: Build and apply AlbumentationsX augmentation pipelines on FiftyOne datasets.
js_bundle: albumentationsx_plugin/hosts/fiftyone/assets/toolbar.js
fiftyone:
  version: ">=1.19,<2"
operators:
  - augment_with_albumentationsx
  - analyze_albumentationsx_dataset_compatibility
  - show_albumentationsx_capabilities
  - manage_albumentationsx_presets
  - view_albumentationsx_run
  - delete_albumentationsx_run
