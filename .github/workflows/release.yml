name: Release verification

on:
  push:
    tags:
      - "[0-9]*"
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to verify"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify release tag (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    steps:
      - name: Check out release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          python-version: "3.11"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development dependencies
        run: uv sync --frozen --group dev

      - name: Verify tag and plugin metadata agree
        run: uv run python scripts/verify_release_tag.py ${{ inputs.release_tag || github.ref_name }}

      - name: Run the complete test suite
        run: uv run pytest --cov-fail-under=85
