name: Release verification

on:
  push:
    tags:
      - "[0-9]*"
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to verify"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify release tag (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.release_tag || github.ref_name }}

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify the lockfile
        run: uv lock --check

      - name: Install locked development dependencies
        run: uv sync --frozen --group dev

      - name: Verify tag and plugin metadata agree
        run: uv run python scripts/verify_release_tag.py ${{ github.event.inputs.release_tag || github.ref_name }}

      - name: Run the complete test suite
        run: uv run pytest --cov-fail-under=85

  artifacts:
    name: Publish release artifacts
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.release_tag || github.ref_name }}

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          python-version: "3.10"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify the lockfile
        run: uv lock --check

      - name: Install locked development dependencies
        run: uv sync --frozen --group dev

      - name: Verify tag and plugin metadata agree
        run: uv run python scripts/verify_release_tag.py "$RELEASE_TAG"

      - name: Build Python distribution
        run: uv build

      - name: Build checksummed release artifacts
        run: |
          uv run python scripts/report_transform_capabilities.py --output "dist/capability-report-${RELEASE_TAG}.md"
          uv run python scripts/build_release_artifacts.py --tag "$RELEASE_TAG"

      - name: Publish assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_tag="v${RELEASE_TAG#v}"
          install_notes="dist/albumentationsx-fiftyone-plugin-${artifact_tag}-install.md"
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$install_notes"
          gh release upload "$RELEASE_TAG" dist/* --clobber
